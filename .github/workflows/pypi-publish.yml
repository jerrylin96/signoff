name: pypi-publish

# Publishes signoff-mcp to PyPI via trusted publishing (OIDC) — no stored
# credentials anywhere. One-time user action on pypi.org before the first
# dispatch: add a trusted publisher for the signoff-mcp project (or as a
# "pending publisher" if the name is not yet registered) with
# owner=jerrylin96, repository=signoff, workflow=pypi-publish.yml,
# environment=pypi. Until that exists, the publish job fails with an OIDC
# error and nothing else is affected. Dispatch manually per release.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
