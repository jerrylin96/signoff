name: Release

on:
  push:
    tags: [ 'v*' ]
  # Dispatch path: cloud sessions cannot push tags through the git proxy, so
  # the release can also be cut from the Actions UI/API; the tag is then
  # created by `gh release create` at the dispatched commit.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag from project version
        id: ver
        run: |
          PROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PROJECT_VERSION" >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (creates the tag on dispatch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" --generate-notes \
            --target "$GITHUB_SHA"
