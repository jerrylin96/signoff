name: pages

# Deploys site/ (self-contained static HTML, host-portable by construction —
# see docs/productionization.md) to GitHub Pages. configure-pages attempts
# to enable Pages on first run; if the token lacks permission, enable it
# once in Settings → Pages → Source: GitHub Actions and re-run.

on:
  push:
    branches: [ main ]
    paths: [ 'site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
